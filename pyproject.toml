[project]
name = "hexlet-code"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 80
extend-exclude = ["*/migrations/*", "task_manager/settings.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
