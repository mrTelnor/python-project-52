{% extends 'layout.html' %}
{% load i18n %}

{% block title %}{% translate "Edit label" %}{% endblock %}

{% block content %}
  <h1 class="my-4 text-3xl font-bold">{% translate "Edit label" %}</h1>
  <form method="post" action="{% url 'label_update' object.pk %}" class="max-w-lg">
    {% include 'partials/form_fields.html' %}
    <button type="submit" class="cursor-pointer rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">{% translate "Update" %}</button>
  </form>
{% endblock %}
