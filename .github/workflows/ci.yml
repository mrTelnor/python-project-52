name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: Установка зависимостей
        run: uv sync --locked
      - name: Проверка Ruff
        run: make lint
      - name: Тесты и покрытие
        run: make test-coverage

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: Установка зависимостей
        run: uv sync --locked
      - name: Проверка подключения к PostgreSQL
        run: >-
          uv run python manage.py shell -c
          "from django.db import connection;
          assert connection.vendor == 'postgresql';
          connection.ensure_connection();
          print('PostgreSQL: подключение установлено')"
      - name: Тесты PostgreSQL
        run: make test
